<!--
  Input del chat: textarea autoajustable + adjuntar archivo + botón enviar/detener.
  El botón de clip abre el selector de archivos (PDF, Word).
  El archivo adjunto se muestra como un chip con opción de eliminar.
-->
<form class="input-area" (submit)="handleSubmit($event)" novalidate>

  <!-- Chip del archivo adjunto (visible solo cuando hay un archivo seleccionado) -->
  @if (attachedFileName()) {
    <div class="input-area__attachment">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span class="input-area__attachment-name">{{ attachedFileName() }}</span>
      <button
        type="button"
        class="input-area__attachment-remove"
        (click)="removeAttachment()"
        aria-label="Eliminar archivo adjunto"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }

  <div class="input-area__wrapper">

    <!-- Input oculto para selección de archivos -->
    <input
      #fileInput
      type="file"
      accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      style="display: none"
      (change)="onFileSelected($event)"
    />

    <!-- Botón adjuntar archivo -->
    <button
      type="button"
      class="input-area__btn input-area__btn--attach"
      (click)="openFilePicker()"
      [disabled]="isThinking()"
      aria-label="Adjuntar CV (PDF o Word)"
      title="Adjuntar CV"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </button>

    <textarea
      #textarea
      class="input-area__textarea"
      [(ngModel)]="text"
      name="message"
      placeholder="Escribí tu mensaje o adjuntá un CV..."
      rows="1"
      [disabled]="isThinking()"
      (input)="autoResize()"
      (keydown)="handleKeyDown($event)"
      aria-label="Mensaje"
      aria-multiline="true"
      [attr.aria-disabled]="isThinking()"
    ></textarea>

    @if (isThinking()) {
      <button
        type="button"
        class="input-area__btn input-area__btn--stop"
        (click)="stopClicked.emit()"
        aria-label="Detener respuesta"
        title="Detener"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
      </button>
    } @else {
      <button
        type="submit"
        class="input-area__btn input-area__btn--send"
        [disabled]="!canSend()"
        aria-label="Enviar mensaje"
        title="Enviar (Enter)"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    }
  </div>
</form>
